<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="none">
  <defs>
    <radialGradient id="purpleGradient" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#6B46C1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6B46C1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGradient" cx="70%" cy="40%" r="60%" fx="70%" fy="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkGradient" cx="50%" cy="70%" r="65%" fx="50%" fy="70%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#121212" />
  <g filter="url(#blurFilter)">
    <circle cx="30%" cy="30%" r="400" fill="url(#purpleGradient)" />
    <circle cx="70%" cy="40%" r="350" fill="url(#blueGradient)" />
    <circle cx="50%" cy="70%" r="380" fill="url(#pinkGradient)" />
  </g>
</svg>